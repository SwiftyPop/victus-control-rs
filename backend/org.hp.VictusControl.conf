<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root user can own the VictusControl service -->
  <policy user="root">
    <allow own="org.hp.VictusControl"/>
    <allow send_destination="org.hp.VictusControl"/>
    <allow receive_sender="org.hp.VictusControl"/>
  </policy>

  <!-- Allow members of the victus group to communicate with the service -->
  <policy group="victus">
    <allow send_destination="org.hp.VictusControl"/>
    <allow receive_sender="org.hp.VictusControl"/>
  </policy>

  <!-- Deny unprivileged users outside victus group by default -->
  <policy context="default">
    <deny send_destination="org.hp.VictusControl"/>
  </policy>
</busconfig>

