[workspace]
resolver = "2"
members = ["common", "backend", "frontend", "installer", "monitor"]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["SwiftyPop <https://github.com/SwiftyPop>"]

[workspace.dependencies]

zbus = "5.5"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
gtk4 = "0.11"
glib = "0.22"
gio = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
